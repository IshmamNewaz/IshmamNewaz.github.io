<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#14182e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Letter 'I' Gradient -->
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Top & Bottom Accent Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="128" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="18" />

  <!-- Inner Soft Light -->
  <circle cx="256" cy="256" r="160" fill="url(#radial-glow)" />

  <!-- Geometric Letter "I" -->
  <g>
    <!-- Top Cap Bar -->
    <rect x="156" y="120" width="200" height="48" rx="24" fill="url(#bar-grad)" />
    
    <!-- Central Vertical Pillar -->
    <rect x="220" y="144" width="72" height="224" rx="16" fill="url(#letter-grad)" />
    
    <!-- Bottom Base Bar -->
    <rect x="156" y="344" width="200" height="48" rx="24" fill="url(#bar-grad)" />
  </g>
</svg>